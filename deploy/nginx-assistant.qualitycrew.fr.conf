# Nginx : assistant.qualitycrew.fr -> serveur Node local (port 3000)
# Le HTTPS (port 443) est ajouté automatiquement par certbot, voir deploy/README.md
server {
    listen 80;
    listen [::]:80;
    server_name assistant.qualitycrew.fr;

    client_max_body_size 200k;

    # Modèle 3D, scripts, images : compressés et gardés en cache par le navigateur
    gzip on;
    gzip_types application/javascript text/javascript text/css application/json application/wasm application/octet-stream model/gltf-binary;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Réponses de l'IA envoyées au fil de l'eau : pas de mise en tampon
    location /api/chat {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
