<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="favicon.ico" />
  <title>Dhafer • Robot 3D Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- MediaPipe : visage, pose et accès webcam -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #020617;
      color: #e5e7eb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #top {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    #scene-container {
      flex: 1;
      min-width: 0;
    }

    #side {
      width: 280px;
      border-left: 1px solid #1f2933;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: radial-gradient(circle at top, #0f172a, #020617);
    }

    video {
      width: 100%;
      border-radius: 8px;
      border: 1px solid #374151;
      background: black;
    }

    #answer {
      margin-top: 8px;
      font-size: 0.9rem;
      background: #020617;
      border-radius: 8px;
      border: 1px solid #1f2937;
      padding: 8px;
      min-height: 60px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    #ui {
      border-top: 1px solid #1f2937;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #020617;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: 500;
      background: #111827;
      color: #e5e7eb;
      transition: background 0.15s, transform 0.05s;
    }

    button:hover {
      background: #1f2937;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button:active {
      transform: scale(0.97);
    }

    #talkBtn {
      background: #16a34a;
      color: white;
      font-weight: 600;
    }

    #talkBtn:hover {
      background: #22c55e;
    }

    #status {
      flex: 1;
      font-size: 0.85rem;
      color: #9ca3af;
    }

    /* Écrans étroits : la scène passe au-dessus, le panneau en dessous */
    @media (max-width: 720px) {
      #top { flex-direction: column; }
      #scene-container { min-height: 0; }
      #side {
        width: 100%;
        border-left: none;
        border-top: 1px solid #1f2933;
        flex-direction: row;
        max-height: 35vh;
      }
      video { width: 40%; object-fit: cover; }
      #answer { flex: 1; margin-top: 0; }
      #ui { flex-wrap: wrap; }
      #status { flex-basis: 100%; }
    }

    #modeAssistantBtn.active,
    #modeMiroirBtn.active {
      background: #4ade80;
      color: #022c22;
    }
  </style>
</head>
<body>
  <div id="top">
    <div id="scene-container"></div>
    <div id="side">
      <video id="inputVideo" autoplay muted playsinline></video>
      <div id="answer">Réponses du robot ici…</div>
    </div>
  </div>

  <div id="ui">
    <button id="talkBtn">🎙️ Activer écoute auto</button>
    <button id="modeAssistantBtn">🤖 Assistant</button>
    <button id="modeMiroirBtn">🪞 Miroir</button>
    <button id="avatarBtn" title="Changer d'avatar">🧍 Humanoïde</button>
    <div id="status">Prêt.</div>
  </div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

  <script type="module" src="js/main.js"></script>
</body>
</html>
