<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="favicon.ico" />
  <title>Dhafer • Robot 3D Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Assistant 3D de Dhafer Bouthelja : pose tes questions sur son parcours et sur Quality Crew." />
  <!-- Mode intégré (iframe sur un autre site) : activé par ?embed avant l'affichage -->
  <script>
    if (new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embed");
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #020617;
      color: #e5e7eb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100vh;
      height: 100dvh; /* mobile : hauteur réellement visible */
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #top {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    #scene-container {
      flex: 1;
      min-width: 0;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }

    /* Le canvas suit la taille du conteneur, jamais l'inverse (sinon la page déborde) */
    #scene-container canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #side {
      width: 340px;
      min-height: 0;
      border-left: 1px solid #1f2933;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: radial-gradient(circle at top, #0f172a, #020617);
    }

    /* Aperçu webcam (iframe isolée de js/tracking.js), visible seulement quand le suivi est actif */
    #trackingSlot {
      display: none;
      flex: none;
      aspect-ratio: 4 / 3;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #374151;
      background: black;
    }

    #trackingSlot iframe { width: 100%; height: 100%; border: 0; display: block; }

    body.tracking #trackingSlot { display: block; }

    #camBtn.active { background: #1d4ed8; color: white; }

    /* Fil de discussion */
    #chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 4px 2px;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    #chat:empty::before {
      content: "Pose-moi une question à voix haute ou par écrit 👋";
      color: #6b7280;
      margin: auto;
      text-align: center;
    }

    .bubble {
      max-width: 88%;
      padding: 8px 12px;
      border-radius: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .bubble.user {
      align-self: flex-end;
      background: #1d4ed8;
      color: #eff6ff;
      border-bottom-right-radius: 4px;
    }

    .bubble.assistant {
      align-self: flex-start;
      background: #111827;
      border: 1px solid #1f2937;
      border-bottom-left-radius: 4px;
    }

    .bubble.pending { color: #9ca3af; }
    .bubble.interrupted { opacity: 0.6; }
    .bubble.error { border-color: #7f1d1d; color: #fca5a5; }

    #chatForm {
      display: flex;
      gap: 6px;
    }

    #chatInput {
      flex: 1;
      min-width: 0;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid #374151;
      background: #020617;
      color: #e5e7eb;
      font: inherit;
      font-size: 0.9rem;
    }

    #chatInput:focus {
      outline: none;
      border-color: #3b82f6;
    }

    #sendBtn {
      background: #2563eb;
      color: white;
      padding: 8px 14px;
    }

    #sendBtn:hover { background: #3b82f6; }

    #ui {
      border-top: 1px solid #1f2937;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #020617;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: 500;
      background: #111827;
      color: #e5e7eb;
      transition: background 0.15s, transform 0.05s;
    }

    button:hover {
      background: #1f2937;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button:active {
      transform: scale(0.97);
    }

    #talkBtn {
      background: #16a34a;
      color: white;
      font-weight: 600;
    }

    #talkBtn:hover {
      background: #22c55e;
    }

    #status {
      flex: 1;
      font-size: 0.85rem;
      color: #9ca3af;
    }

    #status a { color: #93c5fd; }

    /* Écrans étroits : la scène passe au-dessus, le panneau en dessous */
    @media (max-width: 720px) {
      #top { flex-direction: column; }
      #scene-container { min-height: 0; }
      #side {
        width: 100%;
        border-left: none;
        border-top: 1px solid #1f2933;
        height: 42vh;
        flex: none;
      }
      /* La vidéo reste active pour le suivi, mais on ne l'affiche pas */
      /* Petite vignette dans un coin : on voit que la caméra est active */
      #trackingSlot { position: fixed; top: 8px; right: 8px; width: 96px; z-index: 10; }
      #ui { flex-wrap: wrap; }
      #status { flex-basis: 100%; }
    }

    /* Mode intégré : fenêtre compacte (iframe), scène en haut, conversation en bas */
    .embed #top { flex-direction: column; }
    .embed #scene-container { flex: 0 0 46%; min-height: 0; }
    .embed #side {
      width: 100%;
      height: auto;
      flex: 1;
      border-left: none;
      border-top: 1px solid #1f2933;
    }
    .embed #trackingSlot { position: fixed; top: 8px; right: 8px; width: 96px; z-index: 10; }
    .embed #modeAssistantBtn, .embed #modeMiroirBtn { display: none; }
    .embed #ui { padding: 8px; gap: 8px; flex-wrap: wrap; }
    .embed #ui button { padding: 6px 12px; font-size: 0.85rem; }
    .embed #status { font-size: 0.75rem; flex-basis: 100%; }

    #modeAssistantBtn.active,
    #modeMiroirBtn.active {
      background: #4ade80;
      color: #022c22;
    }
  </style>
</head>
<body>
  <div id="top">
    <div id="scene-container"></div>
    <div id="side">
      <div id="trackingSlot"></div>
      <div id="chat" aria-live="polite"></div>
      <form id="chatForm" autocomplete="off">
        <input id="chatInput" type="text" placeholder="Écris ta question…" maxlength="2000" />
        <button id="sendBtn" type="submit" aria-label="Envoyer">➤</button>
      </form>
    </div>
  </div>

  <div id="ui">
    <button id="talkBtn">🎙️ Activer écoute auto</button>
    <button id="camBtn" title="L'avatar suit les mouvements de ta tête et de tes bras">📷 Activer le suivi</button>
    <button id="modeAssistantBtn">🤖 Assistant</button>
    <button id="modeMiroirBtn">🪞 Miroir</button>
    <div id="status">Prêt.</div>
  </div>
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three/build/three.module.js",
    "three/addons/": "/vendor/three/examples/jsm/"
  }
}
</script>

  <script type="module" src="js/main.js"></script>
</body>
</html>
