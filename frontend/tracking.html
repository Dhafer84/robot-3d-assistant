<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Suivi webcam</title>
  <!--
    Suivi webcam isolé (MediaPipe), chargé dans une iframe par js/tracking.js seulement
    quand le visiteur active le suivi. MediaPipe a besoin d'eval() : cette page est la
    seule à l'autoriser (backend/security.js). Elle n'affiche aucun texte venant de l'IA
    ni du visiteur, et n'envoie à la page principale que des nombres.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
  </style>
</head>
<body>
  <video id="video" autoplay muted playsinline></video>
  <script src="/vendor/mediapipe/face_mesh/face_mesh.js"></script>
  <script src="/vendor/mediapipe/pose/pose.js"></script>
  <script src="/vendor/mediapipe/camera_utils/camera_utils.js"></script>
  <script src="/js/tracking-frame.js"></script>
</body>
</html>
